# Temporal: baja fotos libres de construcciones reales cerca de la Sierra de las Ánimas
# (Wikimedia Commons, búsqueda por coordenadas) con sus licencias, para elegir cuáles usar.
name: Bajar fotos de construcciones de la zona
on:
  push:
    branches: [obras-sierra]
    paths: [.github/workflows/obras-sierra.yml]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar fotos y créditos
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          UA = {"User-Agent": "basalto-demo/1.0 (https://github.com/smellclub/basalto)"}
          def api(p):
              u = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({**p, "format": "json"})
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA)))
          K = re.compile("castillo|castle|casa|capilla|iglesia|church|hotel|estancia|chacra|house|piria|pittamiglio|pitamiglio|cristo|edificio|posada|museo|museum|arquitect|bodega|parador|torre|rancho|vivienda|villa|aerosilla|mirador|argentino", re.I)
          titles = []
          for lat, lon in [(-34.75, -55.32), (-34.80, -55.23), (-34.86, -55.28), (-34.78, -55.37), (-34.87, -55.23)]:
              d = api({"action": "query", "list": "geosearch", "gscoord": f"{lat}|{lon}", "gsradius": 10000, "gsnamespace": 6, "gslimit": 500})
              for x in d["query"]["geosearch"]:
                  if K.search(x["title"]) and x["title"] not in titles:
                      titles.append(x["title"])
          os.makedirs("obras-candidatas", exist_ok=True)
          credits = []
          for i in range(0, len(titles), 40):
              d = api({"action": "query", "titles": "|".join(titles[i:i + 40]), "prop": "imageinfo",
                       "iiprop": "url|size|extmetadata", "iiurlwidth": 1280})
              for p in d["query"]["pages"].values():
                  ii = p["imageinfo"][0]; m = ii.get("extmetadata", {})
                  g = lambda k: re.sub(r"\s+", " ", re.sub("<[^>]+>", "", m.get(k, {}).get("value", ""))).strip()
                  url = ii["url"] if ii["width"] <= 1280 else ii["thumburl"].split("?")[0].replace("thumb.wikimedia.org", "upload.wikimedia.org")
                  name = f"obras-candidatas/{len(credits):02d}.jpg"
                  for attempt in range(4):
                      try:
                          data = urllib.request.urlopen(urllib.request.Request(url, headers=UA)).read(); break
                      except Exception as e:
                          print("retry", name, e); time.sleep(10 * (attempt + 1))
                  else:
                      continue
                  open(name, "wb").write(data)
                  credits.append({"file": name, "title": p["title"], "author": g("Artist"), "license": g("LicenseShortName"),
                                  "licenseUrl": g("LicenseUrl"), "page": ii["descriptionurl"], "description": g("ImageDescription")[:300],
                                  "width": ii["width"], "height": ii["height"]})
                  print(name, p["title"])
                  time.sleep(2)
          json.dump(credits, open("obras-candidatas/creditos.json", "w"), ensure_ascii=False, indent=2)
          PY
      - name: Subir a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add obras-candidatas
          git commit -m "Fotos candidatas de construcciones de la zona (Wikimedia Commons)"
          git push
