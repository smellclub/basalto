# Temporal: busca fotos de gimnasio en Unsplash (licencia Unsplash, sin las "Plus"/premium)
# y sube miniaturas + datos a esta rama para elegir. Se descarta una vez elegidas.
name: Buscar fotos de gimnasio
on:
  push:
    branches: [fotos-gym]
    paths: [.github/workflows/fotos-gym.yml]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar y bajar miniaturas
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "en"}), timeout=30).read()
          slugs = ["gym", "gym-interior", "weightlifting", "boxing-gym", "crossfit", "personal-trainer",
                   "functional-training", "kettlebell", "deadlift", "battle-ropes", "spin-class", "gym-woman", "gym-man"]
          os.makedirs("gym", exist_ok=True)
          seen, out = set(), []
          for s in slugs:
              try:
                  html = get(f"https://unsplash.com/s/photos/{s}?license=free").decode("utf-8", "ignore")
              except Exception as e:
                  print("page fail", s, e); continue
              ids = re.findall(r"https://images\.unsplash\.com/photo-([0-9]+-[0-9a-f]+)", html)
              print(s, len(set(ids)))
              for pid in dict.fromkeys(ids):
                  if pid in seen or len(out) >= 160: continue
                  seen.add(pid)
                  name = f"gym/{len(out):03d}.jpg"
                  try:
                      open(name, "wb").write(get(f"https://images.unsplash.com/photo-{pid}?w=360&q=55&fm=jpg"))
                  except Exception as e:
                      print("dl fail", pid, e); continue
                  out.append({"file": name, "q": s, "id": pid})
          json.dump(out, open("gym/gym.json", "w"), indent=1)
          print(len(out))
          PY
      - name: Subir a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add gym
          git commit -m "Fotos de gimnasio candidatas (Unsplash)"
          git push
