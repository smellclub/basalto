# Temporal: busca fotos de gimnasio en Unsplash (licencia Unsplash, sin las "Plus"/premium)
# y sube miniaturas + datos a esta rama para elegir. Se descarta una vez elegidas.
name: Buscar fotos de gimnasio
on:
  push:
    branches: [fotos-gym]
    paths: [.github/workflows/fotos-gym.yml]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar originales (POST de descarga de StockSnap)
        run: |
          mkdir -p gym/full
          python3 - <<'PY'
          import json, re, http.cookiejar, urllib.request, urllib.parse
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [("User-Agent", UA)]
          for p in json.load(open("gym/pick.json")):
              pid = p["url"].rsplit("/", 1)[1].split(".")[0]
              try:
                  page = op.open(p["landing"], timeout=30).read().decode("utf-8", "ignore")
                  token = re.search(r'name="_token" value="([^"]+)"', page) or re.search(r'csrf-token" content="([^"]+)"', page)
                  data = {"photo_id": pid}
                  if token: data["_token"] = token.group(1)
                  req = urllib.request.Request("https://stocksnap.io/photo/download", data=urllib.parse.urlencode(data).encode(),
                                               headers={"Referer": p["landing"], "X-Requested-With": "XMLHttpRequest"})
                  r = op.open(req, timeout=60)
                  body = r.read()
                  ct = r.headers.get("content-type", "")
                  print(p["name"], r.status, ct, len(body), r.geturl()[:120])
                  if "image" in ct:
                      open(f"gym/full/{p['name']}.jpg", "wb").write(body)
                  else:
                      print("  ", body[:300])
              except Exception as e:
                  print(p["name"], "fail", e)
          PY
      - name: Subir a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add gym/full || true
          git commit -m "Fotos originales" || true
          git push
