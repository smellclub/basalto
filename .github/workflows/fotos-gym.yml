# Temporal: busca fotos de gimnasio en Unsplash (licencia Unsplash, sin las "Plus"/premium)
# y sube miniaturas + datos a esta rama para elegir. Se descarta una vez elegidas.
name: Buscar fotos de gimnasio
on:
  push:
    branches: [fotos-gym]
    paths: [.github/workflows/fotos-gym.yml]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar y bajar miniaturas
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (gym-demo)", "Accept": "application/json"}
          queries = ["gym", "gym interior", "weightlifting", "boxing gym", "crossfit", "personal trainer",
                     "functional training", "spinning class", "kettlebell", "deadlift", "gym athlete", "battle ropes"]
          os.makedirs("gym", exist_ok=True)
          seen, out = set(), []
          for q in queries:
              url = "https://unsplash.com/napi/search/photos?" + urllib.parse.urlencode({"query": q, "per_page": 30})
              try:
                  data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA)))
              except Exception as e:
                  print("search fail", q, e); continue
              for p in data.get("results", []):
                  if p["id"] in seen or p.get("premium") or p.get("plus"): continue
                  raw = p["urls"]["raw"]
                  if "plus.unsplash.com" in raw: continue
                  seen.add(p["id"])
                  name = f"gym/{len(out):03d}.jpg"
                  thumb = raw + ("&" if "?" in raw else "?") + "w=360&q=55&fm=jpg"
                  try:
                      open(name, "wb").write(urllib.request.urlopen(urllib.request.Request(thumb, headers={"User-Agent": UA["User-Agent"]})).read())
                  except Exception as e:
                      print("dl fail", p["id"], e); continue
                  out.append({"file": name, "q": q, "id": p["id"], "raw": raw, "w": p["width"], "h": p["height"],
                              "alt": p.get("alt_description"), "author": p["user"]["name"],
                              "page": p["links"]["html"]})
          json.dump(out, open("gym/gym.json", "w"), indent=1)
          print(len(out))
          PY
      - name: Subir a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add gym
          git commit -m "Fotos de gimnasio candidatas (Unsplash)"
          git push
