# Temporal: busca fotos de gimnasio en Unsplash (licencia Unsplash, sin las "Plus"/premium)
# y sube miniaturas + datos a esta rama para elegir. Se descarta una vez elegidas.
name: Buscar fotos de gimnasio
on:
  push:
    branches: [fotos-gym]
    paths: [.github/workflows/fotos-gym.yml]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar las elegidas en tamaño web
        run: |
          mkdir -p gym/final
          python3 - <<'PY'
          import json, subprocess, urllib.request
          for p in json.load(open("gym/pick.json")):
              raw = f"gym/final/{p['name']}.orig"
              # El buscador da la versión de 960 px: probamos versiones más grandes del mismo CDN.
              for size in ["2880w", "1920w", "1280w", "960w"]:
                  try:
                      url = p["url"].replace("/960w/", f"/{size}/")
                      open(raw, "wb").write(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "voltio-demo/1.0"}), timeout=60).read())
                      print(p["name"], size); break
                  except Exception as e:
                      print(p["name"], size, "fail", e)
              out = f"gym/final/{p['name']}.jpg"
              if p["name"].startswith("coach-"):
                  args = ["-resize", "900x1200^", "-gravity", "north", "-extent", "900x1200"]
              else:
                  args = ["-resize", "2000x2000>"]
              subprocess.run(["convert", raw, "-auto-orient", *args, "-strip", "-quality", "78", "-interlace", "Plane", out], check=True)
              print(out)
          PY
          rm gym/final/*.orig
      - name: Subir a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add gym/final
          git commit -m "Fotos elegidas en tamaño web"
          git push
