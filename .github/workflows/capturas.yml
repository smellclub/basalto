# Temporal: saca capturas de las demos publicadas para el portfolio de Ema. Se descarta después.
name: Capturas de las demos
on:
  push:
    branches: [retratos]
    paths: [.github/workflows/capturas.yml]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Capturar
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const sites = { "smell-club": "https://smellclub-uy.vercel.app" };
          const out = process.env.GITHUB_WORKSPACE + "/capturas";
          const b = await chromium.launch();
          for (const [name, url] of Object.entries(sites)) {
            for (const [tag, vp, dpr] of [["desk", { width: 1440, height: 900 }, 1], ["mob", { width: 390, height: 844 }, 2]]) {
              const p = await b.newPage({ viewport: vp, deviceScaleFactor: dpr, reducedMotion: "reduce" });
              try {
                await p.goto(url, { waitUntil: "networkidle", timeout: 60000 });
                await p.waitForTimeout(2500);
                await p.screenshot({ path: `${out}/${name}-${tag}.jpg`, type: "jpeg", quality: 82 });
                if (tag === "desk") {
                  const h = await p.evaluate(() => document.body.scrollHeight);
                  for (let y = 0; y < h; y += 400) { await p.evaluate((y) => scrollTo(0, y), y); await p.waitForTimeout(150); }
                  await p.evaluate(() => scrollTo(0, 0)); await p.waitForTimeout(1500);
                  await p.screenshot({ path: `${out}/${name}-full.jpg`, type: "jpeg", quality: 70, fullPage: true });
                  const fs = await import("node:fs");
                  fs.writeFileSync(`${out}/${name}-texto.txt`, await p.evaluate(() => document.title + "\n" + document.body.innerText));
                }
                console.log("ok", name, tag);
              } catch (e) { console.log("fail", name, tag, e.message); }
              await p.close();
            }
          }
          await b.close();
          JS
          mkdir -p $GITHUB_WORKSPACE/capturas && node shot.mjs && ls -la $GITHUB_WORKSPACE/capturas
      - name: Subir a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add capturas
          git commit -m "Capturas nuevas de Smell Club"
          git push
